services:
  anzai:
    image: poillysky/anzai:1.0.2
    container_name: anzai
    restart: always
    ports:
      - "3515:3515"
      - "8515:8515"
    environment:
      DATABASE_URL: sqlite:////app/data/anzai.db
      API_PROXY_TARGET: http://127.0.0.1:8515
      NEXT_PUBLIC_API_BASE: /backend
    volumes:
      - /vol1/1000/Docker/anzai/data:/app/data
      - /vol1/1000/Docker/anzai/.env:/app/api/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3515/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
